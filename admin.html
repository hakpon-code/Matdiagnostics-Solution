<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration - MD Solutions</title>
  <link rel="icon" href="logo-md.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b3c5d;
      --teal: #1aa3b5;
      --green: #2fa37a;
      --yellow: #ffd21f;
      --red: #c0392b;
      --bg: #eef5f8;
      --text: #10283a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden], .hidden { display: none !important; }

    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--navy);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 { font-size: 1.05rem; }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    /* ---------- Connexion ---------- */
    .login-box {
      max-width: 380px;
      margin: 60px auto;
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .login-box h2 { color: var(--navy); margin-bottom: 14px; font-size: 1.2rem; }

    label { display: block; font-weight: 600; font-size: 0.85rem; margin: 12px 0 6px; color: var(--navy); }

    input, select {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 10px 12px;
      border: 2px solid #cfe3ec;
      border-radius: 9px;
      background: #fff;
    }

    button, .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary { background: var(--navy); color: #fff; width: 100%; margin-top: 18px; }
    .btn-out { background: #e3edf2; color: var(--navy); }
    .btn-wa { background: #25d366; color: #fff; padding: 9px 16px; }
    .btn-del { background: #fbe9e7; color: var(--red); padding: 9px 16px; }
    .btn-danger { background: var(--red); color: #fff; }

    .error { color: var(--red); font-size: 0.85rem; margin-top: 10px; min-height: 1em; }

    /* ---------- Liste ---------- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stats { display: flex; gap: 8px; flex-wrap: wrap; }

    .stats span {
      background: #fff;
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .filters { display: flex; gap: 10px; }
    .filters select { width: auto; }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border-left: 6px solid var(--teal);
    }

    .card.nouvelle { border-left-color: var(--yellow); }
    .card.terminee { border-left-color: var(--green); opacity: 0.7; }

    .card-head {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
    }

    .card h3 { color: var(--navy); font-size: 1rem; }
    .meta { font-size: 0.8rem; color: #5a7282; }

    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px 16px;
      margin-top: 12px;
      font-size: 0.9rem;
    }

    .details b { color: var(--navy); }
    .details a { color: var(--teal); }

    .desc {
      margin-top: 12px;
      background: #f5f9fb;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .actions select { width: auto; }

    @media (max-width: 600px) {
      .container { padding: 14px; }
      .filters { width: 100%; }
      .filters select { flex: 1; }
    }
  </style>
</head>
<body>

  <!-- Connexion -->
  <div id="login-view">
    <div class="login-box">
      <h2>Connexion administrateur</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit" class="btn-primary">Se connecter</button>
        <div class="error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- Tableau de bord -->
  <div id="admin-view" hidden>
    <header>
      <h1>MD Solutions · Demandes de service</h1>
      <button class="btn-out" id="logout-btn">Se déconnecter</button>
    </header>

    <div class="container">
      <div class="toolbar">
        <div class="stats">
          <span id="count-total">0 demande</span>
          <span id="count-new">0 nouvelle</span>
        </div>
        <div class="filters">
          <select id="filter">
            <option value="toutes">Toutes</option>
            <option value="nouvelle">Nouvelles</option>
            <option value="en cours">En cours</option>
            <option value="terminee">Terminées</option>
          </select>
          <button class="btn-out" id="refresh-btn">Actualiser</button>
          <button class="btn-danger" id="purge-btn">Supprimer les terminées</button>
        </div>
      </div>

      <div class="error" id="list-error"></div>
      <div id="list"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ktikioeudhiijtfcycwc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8ESqBa375RwiYoPnjYB6EA_pN47snAS";
    const TABLE_URL = SUPABASE_URL + "/rest/v1/demandes_service";
    const STATUTS = [
      { value: "nouvelle", label: "Nouvelle" },
      { value: "en cours", label: "En cours" },
      { value: "terminee", label: "Terminée" }
    ];

    let accessToken = null;
    let demandes = [];

    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function authHeaders(extra = {}) {
      return Object.assign({
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken,
        "Content-Type": "application/json"
      }, extra);
    }

    // Transforme un numéro en lien WhatsApp (sans le +, indicatif 229 du Bénin si absent)
    function waLink(phone) {
      let p = String(phone).replace(/\D/g, "");
      if (p.startsWith("00")) p = p.slice(2);
      else if (!p.startsWith("229") && p.startsWith("0")) p = "229" + p.slice(1);
      else if (!p.startsWith("229")) p = "229" + p;
      return "https://wa.me/" + p;
    }

    async function login(e) {
      e.preventDefault();
      $("login-error").textContent = "";

      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value })
      });

      if (!res.ok) {
        $("login-error").textContent = "Email ou mot de passe incorrect.";
        return;
      }

      const data = await res.json();
      accessToken = data.access_token;
      $("password").value = "";
      $("login-view").hidden = true;
      $("admin-view").hidden = false;
      await loadDemandes();
    }

    async function loadDemandes() {
      $("list-error").textContent = "";
      $("list").innerHTML = "<p>Chargement...</p>";

      const res = await fetch(TABLE_URL + "?select=*&order=created_at.desc", {
        headers: authHeaders()
      });

      if (!res.ok) {
        $("list").innerHTML = "";
        $("list-error").textContent = "Impossible de charger les demandes. Reconnectez-vous si le problème continue.";
        return;
      }

      demandes = await res.json();
      render();
    }

    function render() {
      const filtre = $("filter").value;
      const liste = demandes.filter((d) => filtre === "toutes" || d.statut === filtre);

      $("count-total").textContent = demandes.length + " demande(s)";
      $("count-new").textContent = demandes.filter((d) => d.statut === "nouvelle").length + " nouvelle(s)";

      if (!liste.length) {
        $("list").innerHTML = "<p>Aucune demande pour ce filtre.</p>";
        return;
      }
      $("list").innerHTML = liste.map(cardHTML).join("");
    }

    function cardHTML(d) {
      const date = new Date(d.created_at).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
      const gps = (d.latitude != null && d.longitude != null)
        ? `<a href="https://www.google.com/maps?q=${d.latitude},${d.longitude}" target="_blank" rel="noopener">Voir sur la carte</a>`
        : "Non partagée";

      const options = STATUTS.map((s) =>
        `<option value="${s.value}" ${d.statut === s.value ? "selected" : ""}>${s.label}</option>`
      ).join("");

      return `
        <div class="card ${esc(d.statut)}">
          <div class="card-head">
            <h3>${esc(d.nom)} · ${esc(d.service)}</h3>
            <span class="meta">Reçue le ${esc(date)}</span>
          </div>

          <div class="details">
            <div><b>Téléphone :</b> ${esc(d.telephone)}</div>
            <div><b>Email :</b> ${esc(d.email || "—")}</div>
            <div><b>Date souhaitée :</b> ${esc(d.date_souhaitee || "—")}</div>
            <div><b>Adresse :</b> ${esc(d.adresse || "—")}</div>
            <div><b>Position GPS :</b> ${gps}</div>
          </div>

          <div class="desc">${esc(d.description)}</div>

          <div class="actions">
            <a class="btn btn-wa" href="${waLink(d.telephone)}" target="_blank" rel="noopener">💬 Ouvrir WhatsApp</a>
            <select onchange="changerStatut(${Number(d.id)}, this.value)">${options}</select>
            <button class="btn btn-del" onclick="supprimerDemande(${Number(d.id)})">🗑 Supprimer</button>
          </div>
        </div>`;
    }

    async function changerStatut(id, statut) {
      const res = await fetch(TABLE_URL + "?id=eq." + id, {
        method: "PATCH",
        headers: authHeaders({ "Prefer": "return=minimal" }),
        body: JSON.stringify({ statut: statut })
      });

      if (!res.ok) {
        alert("Mise à jour impossible. Reconnectez-vous et réessayez.");
        return;
      }

      const d = demandes.find((x) => x.id === id);
      if (d) d.statut = statut;
      render();
    }

    async function supprimerDemande(id) {
      if (!confirm("Supprimer définitivement cette demande ? Cette action est irréversible.")) return;

      const res = await fetch(TABLE_URL + "?id=eq." + id, {
        method: "DELETE",
        headers: authHeaders({ "Prefer": "return=minimal" })
      });

      if (!res.ok) {
        alert("Suppression impossible. Reconnectez-vous et réessayez.");
        return;
      }

      demandes = demandes.filter((d) => d.id !== id);
      render();
    }

    async function supprimerTerminees() {
      const n = demandes.filter((d) => d.statut === "terminee").length;
      if (!n) {
        alert("Aucune demande terminée à supprimer.");
        return;
      }
      if (!confirm(`Supprimer définitivement les ${n} demande(s) terminée(s) ? Cette action est irréversible.`)) return;

      const res = await fetch(TABLE_URL + "?statut=eq.terminee", {
        method: "DELETE",
        headers: authHeaders({ "Prefer": "return=minimal" })
      });

      if (!res.ok) {
        alert("Suppression impossible. Reconnectez-vous et réessayez.");
        return;
      }

      demandes = demandes.filter((d) => d.statut !== "terminee");
      render();
    }

    function logout() {
      accessToken = null;
      location.reload();
    }

    $("login-form").addEventListener("submit", login);
    $("logout-btn").addEventListener("click", logout);
    $("refresh-btn").addEventListener("click", loadDemandes);
    $("filter").addEventListener("change", render);
    $("purge-btn").addEventListener("click", supprimerTerminees);
  </script>
</body>
</html>
