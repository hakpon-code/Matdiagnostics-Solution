<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Clients inscrits</title>
<style>body{font-family:Arial,sans-serif;background:#fff;color:#111;margin:0;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.c{border-bottom:1px solid #ddd;padding:12px 0;line-height:1.5}
.n{font-weight:bold;color:#0b3d91}.d{color:#666;font-size:.9rem}
#login{max-width:340px;margin:70px auto}#login input{width:100%;padding:10px;margin-bottom:10px}
button{padding:10px 16px;cursor:pointer}a{color:#0b3d91;cursor:pointer}.err{color:#b00}</style></head><body>
<div id="login"><h2>Espace MatDiagnostics</h2><p class="err" id="e"></p>
<input id="em" type="email" placeholder="Email admin" autocomplete="username">
<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
<button id="b">Entrer</button></div>
<div id="app" hidden><div class="top"><h2>Clients inscrits (<span id="t">0</span>)</h2>
<span><a id="rf">Actualiser</a> · <a id="lo">Déconnexion</a></span></div><div id="list"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
async function load(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { $('login').hidden = false; $('app').hidden = true; return; }
  const {data, error} = await sb.from('clients').select('*').order('created_at', {ascending:false});
  if (error) { $('login').hidden = false; $('app').hidden = true; $('e').textContent = 'Erreur : ' + error.message; return; }
  $('login').hidden = true; $('app').hidden = false; $('t').textContent = data.length;
  const L = $('list'); L.innerHTML = '';
  data.forEach((r, i) => {
    const d = document.createElement('div'); d.className = 'c';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = data.length - i;
    d.append(n, ' [' + [r.nom, r.adresse, r.telephone, r.service + ' (' + fmtPrice(r.prix) + ')'].join(' — ') + ']');
    const t = document.createElement('div'); t.className = 'd';
    t.textContent = 'Inscrit le ' + new Date(r.created_at).toLocaleString('fr-FR', {timeZone:'Africa/Porto-Novo', dateStyle:'short', timeStyle:'short'});
    d.appendChild(t); L.appendChild(d);
  });
}
$('b').onclick = async () => {
  const {error} = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
  if (error) $('e').textContent = 'Connexion impossible : ' + error.message; else load();
};
$('rf').onclick = load;
$('lo').onclick = async () => { await sb.auth.signOut(); location.reload(); };
load();
</script></body></html>
